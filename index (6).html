<style>
  :root {
    --green-950: #0A2415;
    --green-900: #0E3420;
    --green-700: #14492A;
    --green-600: #1B5E34;
    --green-300: #A8E0AE;
    --red: #D0262C;
    --head: "Archivo Black", "Arial Black", Arial, sans-serif;
    --body: "Archivo", "Segoe UI", Roboto, Arial, sans-serif;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(10,36,21,0.06), 0 8px 24px rgba(10,36,21,0.08);
  }

  html[data-theme="light"] {
    --bg: #F4F6F3;
    --surface: #FFFFFF;
    --text: #14231A;
    --muted: #5B6B60;
    --accent: #1B5E34;
    --accent-hover: #14492A;
    --on-accent: #FFFFFF;
    --line: #E1E8E2;
    --soft: #EAF5EC;
    --focus: #8BCB8F;
  }

  html[data-theme="dark"] {
    --bg: #0B1510;
    --surface: #13221A;
    --text: #E8F2EA;
    --muted: #9DB3A4;
    --accent: #7ED08A;
    --accent-hover: #A8E0AE;
    --on-accent: #0A2415;
    --line: #22352A;
    --soft: #172B20;
    --focus: #1B5E34;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent); }
  h1, h2, h3 { font-family: var(--head); line-height: 1.15; margin: 0 0 0.5em; letter-spacing: 0.2px; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.9rem); }
  h2 { font-size: clamp(1.45rem, 3.8vw, 2rem); }
  h3 { font-size: 1.15rem; }
  p { margin: 0 0 1em; }
  .muted { color: var(--muted); }
  .eyebrow {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  /* ---------- Logo (built in; animated in the intro) ---------- */
  .logo-art { width: 100%; height: auto; display: block; overflow: visible; }
  .logo-art text { font-family: var(--head); }
  .logo-art * { transform-box: view-box; transform-origin: 200px 200px; }
  .logo-art .lg-bolt, .logo-art .lg-flash { opacity: 0; }
  .logo-art.play .lg-trace { animation: lgTrace 0.9s cubic-bezier(.6,0,.2,1) 0.1s both; }
  .logo-art.play .lg-fill { animation: lgFade 0.5s ease-out 0.8s both; }
  .logo-art.play .lg-bolt { animation: lgStrike 0.8s ease-out 1s both; }
  .logo-art.play .lg-flash { animation: lgImpact 0.45s ease-out 1.25s both; }
  .logo-art.play .lg-arc { animation: lgSweep 1s cubic-bezier(.2,.8,.2,1) 1.2s both; }
  .logo-art.play .lg-frame { animation: lgSlam 0.6s cubic-bezier(.2,1.3,.4,1) 1.4s both; }
  .logo-art.play .lg-mark { animation: lgPop 0.5s cubic-bezier(.34,1.56,.64,1) 1.7s both; }
  .logo-art.play .lg-letter { animation: lgRise 0.5s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes lgTrace { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes lgFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes lgStrike { 0% { stroke-dashoffset: 320; opacity: 1; } 60% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes lgImpact { 0% { opacity: 0; } 20% { opacity: 0.7; } 100% { opacity: 0; } }
  @keyframes lgSweep { from { transform: rotate(-70deg); opacity: 0; } to { transform: rotate(0deg); opacity: 1; } }
  @keyframes lgSlam { 0% { transform: scaleX(0); opacity: 0; } 40% { opacity: 1; } 100% { transform: scaleX(1); opacity: 1; } }
  @keyframes lgPop { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes lgRise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- Intro ---------- */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 40%, var(--green-600), var(--green-950) 75%);
    overflow: hidden;
    cursor: pointer;
    animation: introOut 0.5s ease 2.5s both;
  }
  .intro-glow {
    position: absolute;
    width: 80vmin;
    height: 80vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(168,224,174,0.55) 0%, transparent 65%);
    opacity: 0;
    animation: glowPulse 1.2s ease-in-out 0.3s 2;
  }
  .intro-logo {
    position: relative;
    z-index: 2;
    width: min(55vw, 240px);
    animation: logoIn 1s cubic-bezier(.2,.8,.2,1) both;
  }
  .intro-sweep {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 40%;
    left: -50%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: sweep 1s ease-in-out 1.1s both;
  }
  @keyframes logoIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes glowPulse { 0%, 100% { opacity: 0; transform: scale(0.8); } 50% { opacity: 0.7; transform: scale(1.1); } }
  @keyframes sweep { from { left: -50%; } to { left: 120%; } }
  @keyframes introOut { to { opacity: 0; visibility: hidden; } }

  /* ---------- Header ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1140px;
    margin: 0 auto;
    padding: 8px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text);
    font-family: var(--head);
    font-size: 0.8rem;
    line-height: 1.15;
  }
  .brand-mark { width: 46px; height: 46px; flex: none; display: block; }
  .topnav { display: none; gap: 2px; margin-left: auto; }
  .topnav a {
    color: var(--muted);
    text-decoration: none;
    padding: 9px 14px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.95rem;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .topnav a:hover { color: var(--text); background: var(--soft); }
  .topnav a[aria-current="page"] { color: var(--on-accent); background: var(--accent); }
  .theme-btn {
    margin-left: auto;
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 14px;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    min-height: 40px;
  }

  /* ---------- Bottom bar (phones) ---------- */
  .bottombar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 50;
    display: flex;
    justify-content: space-around;
    background: var(--surface);
    border-top: 1px solid var(--line);
    box-shadow: 0 -6px 20px rgba(10,36,21,0.06);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .bottombar a {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 52px;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.72rem;
    font-weight: 600;
    border-radius: 12px;
  }
  .bottombar a svg { width: 22px; height: 22px; }
  .bottombar a[aria-current="page"] { color: var(--accent); }

  /* ---------- Layout ---------- */
  main { min-height: 70vh; }
  .page { display: none; }
  .page.active { display: block; animation: fadeUp 0.4s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .wrap { max-width: 1140px; margin: 0 auto; padding: 0 18px; }
  .section { padding: 44px 0; }

  /* Hero band */
  .hero {
    background:
      radial-gradient(circle at 85% 20%, rgba(168,224,174,0.18), transparent 45%),
      linear-gradient(135deg, var(--green-950) 0%, var(--green-700) 60%, var(--green-600) 100%);
    color: #FFFFFF;
    padding: 56px 0 64px;
  }
  .hero-grid {
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 18px;
    display: grid;
    gap: 32px;
    align-items: center;
  }
  .hero .eyebrow { color: var(--green-300); }
  .hero h1 { color: #FFFFFF; margin-bottom: 14px; }
  .hero .lead { color: rgba(255,255,255,0.82); font-size: 1.1rem; max-width: 34em; margin-bottom: 26px; }
  .hero-logo {
    width: min(70vw, 260px);
    margin: 0 auto;
    background: #FFFFFF;
    border-radius: 28px;
    padding: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.3);
  }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 50px;
    padding: 12px 24px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    text-decoration: none;
    font: inherit;
    font-weight: 700;
    font-size: 0.98rem;
    border: 2px solid var(--accent);
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
  }
  .btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); transform: translateY(-1px); }
  .btn.ghost { background: transparent; color: #FFFFFF; border-color: rgba(255,255,255,0.7); }
  .btn.ghost:hover { background: rgba(255,255,255,0.12); border-color: #FFFFFF; color: #FFFFFF; }
  .btn.alt { background: transparent; color: var(--accent); }
  .btn.alt:hover { background: var(--soft); color: var(--accent); }
  .btn.wa { background: #1DA851; border-color: #1DA851; color: #FFFFFF; }
  .btn.wa:hover { background: #178C43; border-color: #178C43; color: #FFFFFF; }
  .btn.small { min-height: 42px; padding: 9px 18px; font-size: 0.9rem; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* Page heading band (inner pages) */
  .page-head {
    background: linear-gradient(135deg, var(--green-950), var(--green-700));
    color: #FFFFFF;
    padding: 44px 0 40px;
  }
  .page-head h2 { color: #FFFFFF; margin-bottom: 8px; }
  .page-head .eyebrow { color: var(--green-300); }
  .page-head p { color: rgba(255,255,255,0.8); margin: 0; max-width: 40em; }

  /* Cards */
  .cards { display: grid; gap: 20px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .cards.two { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 960px) { .cards.three { grid-template-columns: repeat(3, 1fr); } }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card.division { border-top: 4px solid var(--accent); }
  .card .icon-badge {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--soft);
    color: var(--accent);
    display: grid;
    place-items: center;
    margin-bottom: 8px;
  }
  .card .icon-badge svg { width: 22px; height: 22px; }
  .card img.photo {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 10px;
  }
  .card .more { margin-top: auto; padding-top: 10px; font-weight: 700; text-decoration: none; }
  .card .more:hover { text-decoration: underline; }
  .price {
    display: inline-block;
    align-self: flex-start;
    background: var(--soft);
    color: var(--accent);
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 0.95rem;
    margin: 4px 0 6px;
  }
  .card p { margin: 0; }

  .checklist { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .checklist { grid-template-columns: repeat(2, 1fr); } }
  .checklist li {
    display: flex;
    gap: 12px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    font-weight: 500;
  }
  .checklist li::before {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--red);
    flex: none;
  }

  /* Contact cards */
  .contact-card { gap: 12px; }
  .contact-card .phone { font-size: 1.2rem; font-weight: 700; color: var(--text); text-decoration: none; }
  .contact-card .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .email-bar {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--soft);
    border-radius: var(--radius);
    padding: 18px 22px;
  }
  .email-bar a { font-weight: 700; }

  /* Forms */
  .form-wrap { display: grid; gap: 24px; grid-template-columns: 1fr; margin-top: 24px; }
  @media (min-width: 900px) { .form-wrap { grid-template-columns: 1fr 340px; align-items: start; } }
  form.form {
    display: grid;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px;
  }
  .form label { display: grid; gap: 6px; font-weight: 600; font-size: 0.92rem; }
  .form input, .form select, .form textarea {
    font: inherit;
    font-weight: 400;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    min-height: 48px;
    width: 100%;
  }
  .form input:focus, .form select:focus, .form textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--focus); }
  .form textarea { min-height: 120px; resize: vertical; }
  .form .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
  .form .row .btn { flex: 1 1 200px; }
  .status { min-height: 1.4em; color: var(--muted); font-size: 0.95rem; margin: 0; }
  .side-note { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
  .side-note h3 { margin-bottom: 10px; }
  .side-note .contact-line { margin: 0 0 12px; }
  .side-note .contact-line strong { display: block; font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  .side-note .contact-line a { font-weight: 700; font-size: 1.02rem; text-decoration: none; }

  .about-text { max-width: 46em; font-size: 1.08rem; }

  /* Photo galleries */
  .work { margin-top: 44px; }
  .work h3 { margin-bottom: 4px; }
  .gallery { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-top: 16px; }
  .gallery figure { margin: 0; }
  .gallery img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 14px;
    background: var(--soft);
    display: block;
    box-shadow: var(--shadow);
  }
  .gallery figcaption { font-size: 0.88rem; color: var(--muted); margin-top: 6px; }

  /* Footer */
  footer { background: var(--green-950); color: rgba(255,255,255,0.72); padding: 40px 0 110px; margin-top: 40px; }
  .footer-grid { display: grid; gap: 28px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .footer-grid { grid-template-columns: 2fr 1fr 1fr; } }
  footer h3 { color: #FFFFFF; font-size: 0.95rem; margin-bottom: 12px; }
  footer a { color: rgba(255,255,255,0.85); text-decoration: none; }
  footer a:hover { color: #FFFFFF; text-decoration: underline; }
  footer p, footer li { margin: 0 0 6px; font-size: 0.95rem; }
  footer ul { list-style: none; padding: 0; margin: 0; }
  .footer-bottom { border-top: 1px solid rgba(255,255,255,0.12); margin-top: 28px; padding-top: 18px; font-size: 0.88rem; }

  @media (min-width: 760px) {
    .topnav { display: flex; }
    .bottombar { display: none; }
    footer { padding-bottom: 36px; }
    .hero-grid { grid-template-columns: 1.2fr 1fr; }
    .hero-logo { margin: 0 0 0 auto; width: 260px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    #intro { display: none; }
  }
</style>
</head>

      { src: "images/trunking.jpg", alt: "PVC trunking" },
      { src: "images/trunking-cables.jpg", alt: "Trunking with cables" }
    ] },
    { title: "Distribution boards and control panels", text: "Boards and panels that organise and protect the circuits.", items: [
      { src: "images/distribution-board.jpg", alt: "Distribution board wiring" },
      { src: "images/breaker-panel.jpg", alt: "Breaker panel" },
      { src: "images/control-panel.jpg", alt: "Control panel wiring" }
    ] },
    { title: "Cables", text: "Cables used in our installations.", items: [
      { src: "images/cables-1.jpg", alt: "Multicore cables" },
      { src: "images/cables-2.jpg", alt: "Coloured cables" }
    ] },
    { title: "Electrical repairs and testing", text: "Testing and fault finding with a multimeter.", items: [
      { src: "images/repair-testing.jpg", alt: "Technician testing a circuit with a multimeter" }
    ] },
    { title: "CCTV and camera installation", text: "4G solar cameras with pan, tilt and multiple lenses.", items: [
      { src: "images/camera-90k.jpg", alt: "4G solar PTZ camera", caption: "4G solar PTZ camera, ₦90,000" },
      { src: "images/camera-4g-multi.webp", alt: "Multi-lens 4G solar camera" },
      { src: "images/camera-solar.webp", alt: "Dual-lens 4G solar camera" },
      { src: "images/camera-tilt.webp", alt: "Pan and tilt 4G solar camera" },
      { src: "images/camera-triple.webp", alt: "Triple-lens 4G solar camera" }
    ] }
  ];

  /* ---------- Helpers ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const digits = s => s.replace(/\D/g, '');
  const telLink = s => 'tel:+' + digits(s);
  const waLink = n => 'https://wa.me/' + n;

  const ICON = {
    home: '<path d="M3 11l9-8 9 8v9h-6v-6H9v6H3z"/>',
    electrical: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
    farming: '<path d="M4 20c0-6 4-10 16-14-1 10-5 16-11 16-3 0-5-1-5-2z"/><path d="M4 20l8-8"/>',
    about: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>',
    quote: '<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/>',
    contact: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    check: '<path d="M5 12l5 5 9-10"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>'
  };
  const svg = (name, size) => `<svg viewBox="0 0 24 24" width="${size || 22}" height="${size || 22}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;

  /* The DBGCL logo, built from the design we created. animated = true plays the reveal. */
  function logoSVG(uid, animated) {
    const letters = [['D', 132, 2.0], ['B', 166, 2.1], ['G', 200, 2.2], ['C', 234, 2.3], ['L', 268, 2.4]]
      .map(([ch, x, d]) => `<text class="lg-letter" x="${x}" y="210" style="animation-delay:${d}s">${ch}</text>`).join('');
    return `<svg class="logo-art${animated ? ' play' : ''}" viewBox="0 0 400 400" role="img" aria-label="De Best Gadex Company Ltd logo">
      <defs>
        <path id="${uid}-arc" d="M40,200 A160,160 0 0 1 360,200"/>
        <clipPath id="${uid}-clip"><circle cx="200" cy="200" r="130"/></clipPath>
        <filter id="${uid}-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle class="lg-fill" cx="200" cy="200" r="130" fill="#A8E0AE"/>
      <circle class="lg-trace" cx="200" cy="200" r="130" fill="none" stroke="#14492A" stroke-width="14" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/>
      <path class="lg-mark" d="M200,128 L218,146 L218,172 L182,172 L182,146 Z" fill="#D0262C" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
      <path class="lg-mark" d="M200,272 L218,254 L218,228 L182,228 L182,254 Z" fill="#D0262C" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
      <g clip-path="url(#${uid}-clip)">
        <g class="lg-frame"><rect x="40" y="160" width="320" height="80" fill="#FFFFFF" stroke="#D0262C" stroke-width="7"/></g>
      </g>
      <path class="lg-bolt" d="M238,62 L212,118 L230,122 L186,196 L204,200 L176,262" fill="none" stroke="#FFD93B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="320 320" filter="url(#${uid}-glow)"/>
      <circle class="lg-flash" cx="200" cy="200" r="130" fill="#FFFFFF"/>
      <g fill="#14492A" font-size="30" text-anchor="middle">${letters}</g>
      <g class="lg-arc"><text font-size="22" fill="#14492A" text-anchor="middle"><textPath href="#${uid}-arc" startOffset="50%" textLength="450" lengthAdjust="spacing">DE BEST GADEX COMPANY LTD</textPath></text></g>
    </svg>`;
  }

  const E = CONFIG.electrical;
  const F = CONFIG.farming;

  const PAGES = [
    { id: 'home', label: 'Home', icon: 'home' },
    { id: 'about', label: 'About', icon: 'about' },
    { id: 'electrical', label: 'Electrical', icon: 'electrical' },
    { id: 'farming', label: 'Farming', icon: 'farming' },
    { id: 'quote', label: 'Quote', icon: 'quote' },
    { id: 'contact', label: 'Contact', icon: 'contact' }
  ];
  const AVAILABLE = PAGES.map(p => p.id);
  const BOTTOM = PAGES.filter(p => p.id !== 'quote' && p.id !== 'about');

  /* ---------- Page content ---------- */
  function homePage() {
    return `
      <section class="hero">
        <div class="hero-grid">
          <div>
            <span class="eyebrow">Electrical and farming</span>
            <h1>${esc(CONFIG.name)}</h1>
            <p class="lead">Electrical installations and repairs from Gadex Electrical Concept, and catfish, pangasius, tilapia and chicken eggs from Gadex Integrated Farming.</p>
            <div class="actions">
              <a class="btn" href="#quote">Request a quote ${svg('arrow', 18)}</a>
              <a class="btn ghost" href="#contact">Contact us</a>
            </div>
          </div>
          <div class="hero-logo">${logoSVG('hero', false)}</div>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <span class="eyebrow">Our divisions</span>
          <h2>What we do</h2>
          <div class="cards two" style="margin-top:20px">
            <article class="card division">
              <div class="icon-badge">${svg('electrical')}</div>
              <h3>${esc(E.name)}</h3>
              <p class="muted">${esc(E.summary)}</p>
              <a class="more" href="#electrical">View electrical services ${svg('arrow', 16)}</a>
            </article>
            <article class="card division">
              <div class="icon-badge">${svg('farming')}</div>
              <h3>${esc(F.name)}</h3>
              <p class="muted">${esc(F.summary)}</p>
              <a class="more" href="#farming">View farming products ${svg('arrow', 16)}</a>
            </article>
          </div>
        </div>
      </section>`;
  }

  function aboutPage() {
    const paras = CONFIG.about.split(/\n\s*\n/).map(p => `<p>${esc(p.trim())}</p>`).join('');
    return `
      <div class="page-head"><div class="wrap">
        <span class="eyebrow">Who we are</span>
        <h2>About us</h2>
        <p>${esc(CONFIG.name)}</p>
      </div></div>
      <section class="section"><div class="wrap about-text">${paras}</div></section>`;
  }

  function workBlocks() {
    return WORK.map(w => `
      <div class="work">
        <h3>${esc(w.title)}</h3>
        <p class="muted">${esc(w.text)}</p>
        <div class="gallery">${w.items.map(i => `
          <figure>
            <img src="${esc(i.src)}" alt="${esc(i.alt)}" loading="lazy" onerror="this.closest('figure').remove()">
            ${i.caption ? `<figcaption>${esc(i.caption)}</figcaption>` : ''}
          </figure>`).join('')}
        </div>
      </div>`).join('');
  }

  function electricalPage() {
    const items = E.services.map(s => `<li>${esc(s)}</li>`).join('');
    return `
      <div class="page-head"><div class="wrap">
        <span class="eyebrow">Division</span>
        <h2>${esc(E.name)}</h2>
        <p>${esc(E.summary)}</p>
      </div></div>
      <section class="section"><div class="wrap">
        <h3>Our services</h3>
        <ul class="checklist">${items}</ul>
        ${workBlocks()}
        <div class="actions" style="margin-top:28px">
          <a class="btn" href="#quote">Request a quote</a>
          <a class="btn alt" href="${telLink(E.phone)}">Call ${esc(E.phone)}</a>
          <a class="btn wa small" href="${waLink(E.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>
        </div>
      </div></section>`;
  }

  function farmingPage() {
    const cards = F.products.map(p => `
      <article class="card">
        <img class="photo" src="${esc(p.image)}" alt="${esc(p.name)}" onerror="this.remove()">
        <h3>${esc(p.name)}</h3>
        <span class="price">${esc(p.price)}</span>
        <p class="muted">${esc(p.note)}</p>
      </article>`).join('');
    return `
      <div class="page-head"><div class="wrap">
        <span class="eyebrow">Division</span>
        <h2>${esc(F.name)}</h2>
        <p>${esc(F.summary)}</p>
      </div></div>
      <section class="section"><div class="wrap">
        <div class="cards three">${cards}</div>
        <div class="actions" style="margin-top:28px">
          <a class="btn" href="#quote">Order or request a quote</a>
          <a class="btn alt" href="${telLink(F.phone)}">Call ${esc(F.phone)}</a>
          <a class="btn wa small" href="${waLink(F.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>
        </div>
      </div></section>`;
  }

  function quotePage() {
    const eOpts = E.services.map(s => `<option value="electrical|${esc(s)}">${esc(s)}</option>`).join('');
    const fOpts = F.products.map(p => `<option value="farming|${esc(p.name)}">${esc(p.name)} (${esc(p.price)})</option>`).join('');
    return `
      <div class="page-head"><div class="wrap">
        <span class="eyebrow">Get in touch</span>
        <h2>Request a quote or order</h2>
        <p>Choose what you need. We will reply on WhatsApp or by email.</p>
      </div></div>
      <section class="section"><div class="wrap">
        <div class="form-wrap">
          <form class="form" data-kind="quote" novalidate>
            <label>Service or product
              <select name="item" required>
                <option value="">Choose one</option>
                <optgroup label="${esc(E.name)}">${eOpts}</optgroup>
                <optgroup label="${esc(F.name)}">${fOpts}</optgroup>
              </select>
            </label>
            <label>Quantity or size (for fish, in kg)
              <input name="quantity" placeholder="For example, 5 kg">
            </label>
            <label>Your name
              <input name="name" autocomplete="name" required>
            </label>
            <label>Phone number
              <input name="phone" type="tel" autocomplete="tel" required>
            </label>
            <label>Details
              <textarea name="message" placeholder="Location, timing or any other details"></textarea>
            </label>
            ${formButtons()}
          </form>
          ${sideContacts()}
        </div>
      </div></section>`;
  }

  function contactPage() {
    return `
      <div class="page-head"><div class="wrap">
        <span class="eyebrow">Contact</span>
        <h2>Contact us</h2>
        <p>Call or message the division you need, or send us an enquiry below.</p>
      </div></div>
      <section class="section"><div class="wrap">
        <div class="cards two">
          ${contactCard(E, 'electrical')}
          ${contactCard(F, 'farming')}
        </div>
        <div class="email-bar">
          <span>Email us at <a href="mailto:${esc(CONFIG.email)}">${esc(CONFIG.email)}</a></span>
        </div>
        <div class="form-wrap">
          <form class="form" data-kind="contact" novalidate>
            <label>Your name
              <input name="name" autocomplete="name" required>
            </label>
            <label>Phone number
              <input name="phone" type="tel" autocomplete="tel" required>
            </label>
            <label>Which division?
              <select name="division" required>
                <option value="">Choose a division</option>
                <option value="electrical">${esc(E.name)}</option>
                <option value="farming">${esc(F.name)}</option>
              </select>
            </label>
            <label>Topic
              <input name="topic" placeholder="For example, CCTV for my shop" required>
            </label>
            <label>Message (optional)
              <textarea name="message"></textarea>
            </label>
            ${formButtons()}
          </form>
          ${sideContacts()}
        </div>
      </div></section>`;
  }

  function contactCard(d, key) {
    return `
      <article class="card contact-card division">
        <div class="icon-badge">${svg(key)}</div>
        <h3>${esc(d.name)}</h3>
        <a class="phone" href="${telLink(d.phone)}">${esc(d.phone)}</a>
        <div class="btn-row">
          <a class="btn small" href="${telLink(d.phone)}">Call</a>
          <a class="btn wa small" href="${waLink(d.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>
        </div>
      </article>`;
  }

  function sideContacts() {
    return `
      <aside class="side-note">
        <h3>Quick contact</h3>
        <p class="contact-line"><strong>${esc(E.name)}</strong><a href="${telLink(E.phone)}">${esc(E.phone)}</a></p>
        <p class="contact-line"><strong>${esc(F.name)}</strong><a href="${telLink(F.phone)}">${esc(F.phone)}</a></p>
        <p class="contact-line"><strong>Email</strong><a href="mailto:${esc(CONFIG.email)}">${esc(CONFIG.email)}</a></p>
      </aside>`;
  }

  function formButtons() {
    return `<div class="row">
        <button class="btn wa" type="submit" data-via="wa">Send on WhatsApp</button>
        <button class="btn alt" type="submit" data-via="mail">Send by email</button>
      </div>
      <p class="status" role="status"></p>`;
  }

  const RENDER = { home: homePage, about: aboutPage, electrical: electricalPage, farming: farmingPage, quote: quotePage, contact: contactPage };

  /* ---------- Build the navigation and pages ---------- */
  document.getElementById('app').innerHTML = PAGES.map(p =>
    `<section class="page" data-page="${p.id}" aria-label="${esc(p.label)}">${RENDER[p.id]()}</section>`
  ).join('');

  document.getElementById('topnav').innerHTML = PAGES.map(p =>
    `<a href="#${p.id}" data-nav="${p.id}">${esc(p.label)}</a>`
  ).join('');

  document.getElementById('bottombar').innerHTML = BOTTOM.map(p =>
    `<a href="#${p.id}" data-nav="${p.id}">${svg(p.icon)}<span>${esc(p.label)}</span></a>`
  ).join('');

  document.getElementById('footer').innerHTML = `
    <div>
      <p style="font-family:var(--head);color:#FFFFFF;font-size:1rem;margin-bottom:10px">${esc(CONFIG.name)}</p>
      <p>${esc(CONFIG.about)}</p>
    </div>
    <div>
      <h3>Pages</h3>
      <ul>${PAGES.map(p => `<li><a href="#${p.id}">${esc(p.label)}</a></li>`).join('')}</ul>
    </div>
    <div>
      <h3>Contact</h3>
      <ul>
        <li>${esc(E.name)}<br><a href="${telLink(E.phone)}">${esc(E.phone)}</a></li>
        <li>${esc(F.name)}<br><a href="${telLink(F.phone)}">${esc(F.phone)}</a></li>
        <li><a href="mailto:${esc(CONFIG.email)}">${esc(CONFIG.email)}</a></li>
      </ul>
    </div>`;

  document.getElementById('footerBottom').innerHTML = `&copy; ${new Date().getFullYear()} ${esc(CONFIG.name)}. All rights reserved.`;

  document.getElementById('brandMark').innerHTML = logoSVG('brand', false);

  /* ---------- Routing: the hash shows the current page ---------- */
  function route() {
    const requested = (location.hash || '#home').slice(1);
    const current = AVAILABLE.includes(requested) ? requested : 'home';
    document.querySelectorAll('.page').forEach(s => s.classList.toggle('active', s.dataset.page === current));
    document.querySelectorAll('[data-nav]').forEach(a => {
      if (a.dataset.nav === current) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    const label = PAGES.find(p => p.id === current).label;
    document.title = current === 'home' ? CONFIG.name + ' | Electrical and Farming' : label + ' | ' + CONFIG.name;
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();

  /* ---------- Forms: open WhatsApp or email with the details filled in ---------- */
  document.addEventListener('submit', function (e) {
    const form = e.target;
    if (!form.matches('form[data-kind]')) return;
    e.preventDefault();
    const status = form.querySelector('.status');
    if (!form.checkValidity()) {
      status.textContent = 'Please fill in the required fields.';
      form.reportValidity();
      return;
    }

    const kind = form.dataset.kind;
    const via = (e.submitter && e.submitter.dataset.via) || 'wa';
    const data = new FormData(form);
    const get = k => (data.get(k) || '').toString().trim();

    let division;
    let itemLine;
    if (kind === 'quote') {
      const parts = get('item').split('|');
      division = parts[0] === 'electrical' ? E : F;
      itemLine = 'Item: ' + parts[1];
    } else {
      division = get('division') === 'electrical' ? E : F;
      itemLine = 'Topic: ' + get('topic');
    }

    const title = (kind === 'quote' ? 'Quote request' : 'Enquiry') + ' for ' + division.name;
    const text = [
      title,
      'Name: ' + get('name'),
      'Phone: ' + get('phone'),
      itemLine,
      get('quantity') && 'Quantity: ' + get('quantity'),
      get('message') && 'Details: ' + get('message')
    ].filter(Boolean).join('\n');

    if (via === 'wa') {
      window.open(waLink(division.whatsapp) + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
      status.textContent = 'Opening WhatsApp with your details filled in.';
    } else {
      location.href = 'mailto:' + encodeURIComponent(CONFIG.email) + '?subject=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(text);
      status.textContent = 'Opening your email app.';
    }
  });

  /* ---------- Theme (remembered in the browser) ---------- */
  const themeBtn = document.getElementById('themeBtn');
  function readTheme() {
    try { return localStorage.getItem('dbgcl-theme'); } catch (err) { return null; }
  }
  function saveTheme(t) {
    try { localStorage.setItem('dbgcl-theme', t); } catch (err) { /* storage unavailable */ }
  }
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'dark' ? 'Light' : 'Dark';
  }
  applyTheme(readTheme() || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  themeBtn.addEventListener('click', function () {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    saveTheme(next);
  });

  /* ---------- Intro: about 3 seconds, tap to skip ---------- */
  (function () {
    const intro = document.getElementById('intro');
    function endIntro() { if (intro) intro.remove(); }
    const introLogo = document.getElementById('introLogo');
    if (introLogo) introLogo.innerHTML = logoSVG('intro', true);
    if (reduceMotion) { endIntro(); return; }
    intro.addEventListener('pointerdown', endIntro);
    document.addEventListener('keydown', endIntro, { once: true });
    setTimeout(endIntro, 3000);
  })();

  /* ---------- Structured data ---------- */
  (function () {
    const org = {
      '@context': 'https://schema.org',
      '@type': 'Organization',
      name: CONFIG.name,
      url: CONFIG.siteUrl,
      image: CONFIG.siteUrl,
      email: CONFIG.email,
      description: CONFIG.about,
      department: [
        { '@type': 'Organization', name: E.name, telephone: E.phone, description: E.summary },
        { '@type': 'Organization', name: F.name, telephone: F.phone, description: F.summary }
      ]
    };
    const s = document.createElement('script');
    s.type = 'application/ld+json';
    s.textContent = JSON.stringify(org);
    document.head.appendChild(s);
  })();
</script>

</body>
</html>
